name: MySQL migration regression

on:
  pull_request:
    paths:
      - "backend/alembic/**"
      - "backend/app/db/**"
      - "backend/app/models/**"
      - "backend/scripts/check_database_compatibility.py"
      - "backend/tests/test_database_compatibility_script.py"
      - "backend/tests/test_database_integrity_migration.py"
      - ".github/scripts/mysql_migration_regression.py"
      - ".github/workflows/mysql-migrations.yml"
  push:
    paths:
      - "backend/alembic/**"
      - "backend/app/db/**"
      - "backend/app/models/**"
      - "backend/scripts/check_database_compatibility.py"
      - "backend/tests/test_database_compatibility_script.py"
      - "backend/tests/test_database_integrity_migration.py"
      - ".github/scripts/mysql_migration_regression.py"
      - ".github/workflows/mysql-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-regression:
    name: MySQL ${{ matrix.mysql-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ["5.7", "8.0"]

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root-password
          MYSQL_DATABASE: ai_teaching_test
          MYSQL_USER: ai_teaching
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://ai_teaching:test-password@127.0.0.1:3306/ai_teaching_test?charset=utf8mb4
      AI_MOCK_MODE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Exercise legacy-to-head migration
        run: python .github/scripts/mysql_migration_regression.py

      - name: Run read-only database compatibility check
        working-directory: backend
        run: python -m scripts.check_database_compatibility

      - name: Run migration unit tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_database_compatibility_script.py
          tests/test_database_integrity_migration.py
          tests/test_longtext_migration.py
          tests/test_database_init.py
