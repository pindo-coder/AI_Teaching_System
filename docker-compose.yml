services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      # 生产部署使用容器可访问的外部 MySQL，不在 backend 容器内使用 127.0.0.1。
      DATABASE_URL: ${DATABASE_URL:?请在 .env.production 中配置外部 MySQL DATABASE_URL}
      DATABASE_SCHEMA_CHECK_ENABLED: ${DATABASE_SCHEMA_CHECK_ENABLED:-true}
      # 生产环境必须使用 SMTP；Compose 的 --env-file 只负责变量插值，
      # 因此邮件变量需要显式传入 backend 容器。
      MAIL_BACKEND: ${MAIL_BACKEND:?请配置 MAIL_BACKEND=smtp}
      MAIL_HOST: ${MAIL_HOST:?请配置 SMTP MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:?请配置 SMTP 发件账号}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?请配置 SMTP 授权码}
      MAIL_FROM: ${MAIL_FROM:?请配置 SMTP MAIL_FROM}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-true}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost/reset-password}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-http://localhost/verify-email}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost"]}'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 .env.production 中配置 JWT_SECRET_KEY}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请配置初始管理员密码}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AI_MEDIA_DIRECTORY: /app/knowledge/ai_media
      AI_MEDIA_MAX_IMAGES: ${AI_MEDIA_MAX_IMAGES:-2}
      AI_MEDIA_MAX_IMAGE_MB: ${AI_MEDIA_MAX_IMAGE_MB:-5}
      AI_MEDIA_MAX_AUDIO_MB: ${AI_MEDIA_MAX_AUDIO_MB:-10}
      AI_MEDIA_MAX_AUDIO_SECONDS: ${AI_MEDIA_MAX_AUDIO_SECONDS:-60}
      AI_MEDIA_RETENTION_HOURS: ${AI_MEDIA_RETENTION_HOURS:-24}
      AI_MEDIA_USER_QUOTA_MB: ${AI_MEDIA_USER_QUOTA_MB:-50}
      AI_MEDIA_FFPROBE_BINARY: /usr/bin/ffprobe
      AI_VISION_ENABLED: ${AI_VISION_ENABLED:-true}
      AI_VISION_API_KEY: ${AI_VISION_API_KEY:-}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen3-vl-plus}
      AI_VISION_TIMEOUT_SECONDS: ${AI_VISION_TIMEOUT_SECONDS:-90}
      AI_ASR_ENABLED: ${AI_ASR_ENABLED:-true}
      AI_ASR_API_KEY: ${AI_ASR_API_KEY:-}
      AI_ASR_BASE_URL: ${AI_ASR_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_ASR_MODEL: ${AI_ASR_MODEL:-qwen3-asr-flash}
      AI_ASR_TIMEOUT_SECONDS: ${AI_ASR_TIMEOUT_SECONDS:-120}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      CHROMA_PERSIST_DIRECTORY: /app/knowledge/chroma
      KNOWLEDGE_UPLOAD_DIRECTORY: /app/knowledge/uploads
      GENERATED_ARTIFACT_DIRECTORY: /app/knowledge/generated_artifacts
      PRESENTATION_NODE_BINARY: /usr/local/bin/node
      PRESENTATION_NODE_MODULES: /app/presentation_runtime/node_modules
      LOG_LEVEL: INFO
    volumes:
      - app_data:/app/data
      - knowledge_uploads:/app/knowledge/uploads
      - ai_media:/app/knowledge/ai_media
      - chroma_data:/app/knowledge/chroma
      - generated_artifacts:/app/knowledge/generated_artifacts
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  gateway:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    environment:
      # 使用域名时 Caddy 自动申请并续期 HTTPS 证书；未配置域名时保留 IP/HTTP 部署能力。
      APP_SITE_ADDRESS: "${APP_SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CADDYFILE_PATH:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  knowledge_uploads:
  ai_media:
  chroma_data:
  generated_artifacts:
  caddy_data:
  caddy_config:
